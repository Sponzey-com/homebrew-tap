name: Update DevEnv formula

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tap
        uses: actions/checkout@v6

      - name: Update formula from the latest release
        shell: bash
        run: |
          set -euo pipefail

          release_api="https://api.github.com/repos/Sponzey-com/DevEnv/releases/latest"
          tag="$(curl --fail --silent --show-error --location "$release_api" | jq --raw-output '.tag_name')"
          version="${tag#v}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid stable release tag: $tag" >&2
            exit 1
          fi

          export DEVENV_HOMEBREW_VERSION="$version"
          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-unknown-linux-musl \
            x86_64-unknown-linux-musl
          do
            checksum_url="https://github.com/Sponzey-com/DevEnv/releases/download/$tag/devenv-$version-$target.tar.gz.sha256"
            checksum="$(curl --fail --silent --show-error --location "$checksum_url" | awk '{print $1}')"
            if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "invalid checksum for $target: $checksum" >&2
              exit 1
            fi

            variable="DEVENV_HOMEBREW_SHA_${target//-/_}"
            export "$variable=$checksum"
          done

          ruby <<'RUBY'
          path = "Formula/devenv.rb"
          formula = File.read(path)
          version = ENV.fetch("DEVENV_HOMEBREW_VERSION")

          formula.sub!(/version "[^"]+"/, %(version "#{version}"))
          targets = %w[
            aarch64-apple-darwin
            x86_64-apple-darwin
            aarch64-unknown-linux-musl
            x86_64-unknown-linux-musl
          ]

          targets.each do |target|
            variable = "DEVENV_HOMEBREW_SHA_#{target.tr('-', '_')}"
            checksum = ENV.fetch(variable)
            pattern = %r{url "https://github\.com/Sponzey-com/DevEnv/releases/download/v[^/]+/devenv-[^-]+-#{Regexp.escape(target)}\.tar\.gz"\n      sha256 "[0-9a-f]{64}"}
            replacement = %(url "https://github.com/Sponzey-com/DevEnv/releases/download/v#{version}/devenv-#{version}-#{target}.tar.gz"\n      sha256 "#{checksum}")
            raise "formula entry not found for #{target}" unless formula.sub!(pattern, replacement)
          end

          File.write(path, formula)
          RUBY

          ruby -c Formula/devenv.rb

      - name: Commit formula update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/devenv.rb; then
            echo "DevEnv formula is already current"
            exit 0
          fi

          version="$(sed -n 's/^  version "\([^"]*\)"/\1/p' Formula/devenv.rb)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/devenv.rb
          git commit -m "devenv $version"
          git push
